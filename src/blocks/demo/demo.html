<section class="demo">
  <img class="demo__art" src="imgs/common/glass-spiral.webp" alt="" />
  <div class="demo__inner container">
      <div class="demo__info">
        <h2 class="demo__title title title--medium">Нужны подробности по сервису?</h2>
        <p class="demo__lead">Мы подробно расскажем о регламентах, SLA и формате сопровождения партнёров</p>
      </div>
      <form class="form demo__form" novalidate>
        <div class="form__field"><label class="form__label" for="sd-name">Ваше имя:</label><input class="input" id="sd-name" type="text" placeholder="Иван" required /></div>
        <div class="form__field"><label class="form__label" for="sd-phone">Номер телефона:</label><input class="input" id="sd-phone" type="tel" data-js-phone-mask placeholder="+7 (917) 123-45-67" required /></div>
        <div class="form__field"><label class="form__label" for="sd-mail">Электронная почта:</label><input class="input" id="sd-mail" type="email" placeholder="example@mail.com" /></div>
        <div class="form__field"><label class="form__label" for="sd-msg">Комментарий:</label><textarea class="input input--textarea" id="sd-msg" placeholder="Введите текст"></textarea></div>
        <label class="form__check"><input class="form__check-input" type="checkbox" required /><span>Я даю согласие на обработку персональных данных</span></label>
        <button class="form__submit demo__submit" type="submit">Задать вопрос</button>
      </form>
    </div>
</section>
