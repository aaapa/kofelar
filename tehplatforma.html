<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кофелар | Технологическая платформа</title>
  <meta name="description" content="ERP-система, мобильные приложения и аналитика — единая цифровая инфраструктура Кофелар." />
  <load src="src/components/head/head.html" />
</head>
<body class="page-tehplatforma">
  <load src="src/components/header/header.html" />

  <main class="main">
  <load src="src/blocks/tehplatforma/tehplatforma.html" />


  <load src="src/blocks/erp/erp.html" />

  <load src="src/blocks/apps/apps.html" />

  <load src="src/blocks/features/features.html" />

  <section class="demo">
    <img class="demo__art" src="imgs/tehplatforma/demo-shape.webp" alt="" />
    <img class="demo__tech" src="imgs/tehplatforma/glass-technology.webp" alt="" />
    <div class="demo__inner container">
        <div>
          <h2 class="demo__title title--medium">Посмотреть платформу в работе</h2>
          <p class="demo__lead">Запросите демонстрацию — покажем интерфейсы и ответим на технические вопросы</p>
        </div>
        <form class="form demo__form" novalidate>
          <div class="form__field"><label class="form__label" for="d-name">Ваше имя:</label><input class="input" id="d-name" type="text" placeholder="Иван" required /></div>
          <div class="form__field"><label class="form__label" for="d-phone">Номер телефона:</label><input class="input" id="d-phone" type="tel" data-js-phone-mask placeholder="+7 (917) 123-45-67" required /></div>
          <div class="form__field"><label class="form__label" for="d-mail">Электронная почта:</label><input class="input" id="d-mail" type="email" placeholder="example@mail.com" /></div>
          <div class="form__field"><label class="form__label" for="d-msg">Комментарий:</label><textarea class="input input--textarea" id="d-msg" placeholder="Введите текст"></textarea></div>
          <label class="form__check"><input class="form__check-input" type="checkbox" required /><span>Я даю согласие на обработку персональных данных</span></label>
          <button class="form__submit demo__submit" type="submit">Оставить заявку</button>
        </form>
      </div>
</section>

  </main>

  <load src="src/components/footer/footer.html" />
  <load src="src/components/modal/modal.html" />
  <load src="src/components/sprite/sprite.html" />
  <load src="src/components/end/end.html" />
</body>
</html>
